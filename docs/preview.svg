    <text x="561" y="148" font-size="11" font-weight="700" letter-spacing="2" fill="#6c6962">LIGHT READING THEME</text>
    <path d="M40 169h465M535 169h465" stroke="#85837c" opacity=".3"/>
    <text x="66" y="213" font-size="23" font-weight="650" fill="#f3f3f4">Ideas worth sitting with.</text>
    <text x="561" y="213" font-size="23" font-weight="650" fill="#25231f">Ideas worth sitting with.</text>
    <text x="66" y="243" font-size="12" fill="#a6a9af">A quiet corner for a good essay.</text>
    <text x="561" y="243" font-size="12" fill="#6c6962">A quiet corner for a good essay.</text>
    <g fill="#9ba1ab"><rect x="66" y="281" width="408" height="7" rx="3"/><rect x="66" y="302" width="394" height="7" rx="3"/><rect x="66" y="323" width="410" height="7" rx="3"/><rect x="66" y="344" width="295" height="7" rx="3"/><rect x="66" y="384" width="405" height="7" rx="3"/><rect x="66" y="405" width="365" height="7" rx="3"/><rect x="66" y="426" width="396" height="7" rx="3"/></g>
    <g fill="#746f65"><rect x="561" y="281" width="408" height="7" rx="3"/><rect x="561" y="302" width="394" height="7" rx="3"/><rect x="561" y="323" width="410" height="7" rx="3"/><rect x="561" y="344" width="295" height="7" rx="3"/><rect x="561" y="384" width="405" height="7" rx="3"/><rect x="561" y="405" width="365" height="7" rx="3"/><rect x="561" y="426" width="396" height="7" rx="3"/></g>
