<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc">
  <title id="title">Substack Light Reader — dark and light reading themes</title>
  <desc id="desc">A local component illustration. A dark article appears on the left; the same layout with warm white background, dark text and a readable menu appears on the right. This is not a screenshot of a live publication.</desc>
  <rect width="1040" height="580" rx="24" fill="#eeeae0"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="40" y="52" font-size="27" font-weight="700" fill="#25231f">A little more daylight for your reading.</text>
    <text x="40" y="82" font-size="15" fill="#6c6962">Substack Light Reader · Chrome extension + userscript</text>
    <rect x="40" y="115" width="465" height="405" rx="16" fill="#17191c"/>
    <rect x="535" y="115" width="465" height="405" rx="16" fill="#fbfaf7"/>
